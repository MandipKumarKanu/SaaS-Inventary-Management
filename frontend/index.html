<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
      Primary SEO (Bing + Google + Copilot grounding eligible)
      TODO: replace https://www.example.com with your production domain
      in all canonical / OG / sitemap / robots.txt references.
    ============================================================= -->
    <title>Inventory SaaS — Multi-Tenant Warehouse & Inventory Engine</title>
    <meta
      name="description"
      content="Enterprise multi-tenant inventory & warehouse management platform. Real-time stock tracking, purchase orders, cycle counts, and automated routing."
    />
    <link rel="canonical" href="https://www.example.com/login" />
    <!-- Per-route canonical/title/description are updated at runtime by src/components/seo/Seo.jsx -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="bingbot" content="index, follow, max-image-preview:large" />

    <!-- Bing Webmaster Tools verification.
      Replace VERIFY_CODE with the code from
      Bing Webmaster Tools > Add site > Option 2 (meta tag),
      e.g. <meta name="msvalidate.01" content="ABC123..." /> -->
    <meta name="msvalidate.01" content="REPLACE_WITH_BING_VERIFY_CODE" />

    <!-- Open Graph / Twitter (Bing uses these for captions & Copilot citations) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inventory SaaS Engine" />
    <meta property="og:title" content="Inventory SaaS — Multi-Tenant Warehouse & Inventory Engine" />
    <meta
      property="og:description"
      content="Enterprise multi-tenant inventory & warehouse management platform. Real-time stock tracking, purchase orders, cycle counts, and automated routing."
    />
    <meta property="og:url" content="https://www.example.com/login" />
    <meta property="og:image" content="https://www.example.com/og-cover.png" />
    <meta property="og:image:alt" content="Inventory SaaS — Warehouse Management System" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inventory SaaS Engine" />
    <meta
      name="twitter:description"
      content="Enterprise multi-tenant inventory & warehouse management platform."
    />
    <meta name="twitter:image" content="https://www.example.com/og-cover.png" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="Inventory SaaS Engine" />
    <meta name="author" content="Inventory SaaS Engine" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Inventory SaaS Engine",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "Enterprise multi-tenant inventory & warehouse management system.",
        "url": "https://www.example.com/login"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <main>
        <h1>Inventory SaaS: Multi-Tenant Warehouse Engine</h1>
        <p>
          Enterprise multi-tenant inventory & warehouse management platform — real-time stock tracking, purchase orders, and 3PL routing.
        </p>
        <nav>
          <a href="/login">Sign in</a>
          <a href="/signup">Create account</a>
        </nav>
        <footer>
          <p>General inventory management system</p>
        </footer>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
